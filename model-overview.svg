      <g transform="translate(145 202)"><rect width="140" height="42" rx="7" fill="url(#blue)" stroke="#60a5fa"/><text x="70" y="18" fill="#dbeafe" font-size="13" font-weight="700">2 heads · 64 通道</text><text x="70" y="34" fill="#93c5fd" font-size="10">fused Swin</text></g>
      <g transform="translate(185 286)"><rect width="140" height="42" rx="7" fill="url(#blue)" stroke="#60a5fa"/><text x="70" y="18" fill="#dbeafe" font-size="13" font-weight="700">4 heads · 128 通道</text><text x="70" y="34" fill="#93c5fd" font-size="10">fused Swin</text></g>

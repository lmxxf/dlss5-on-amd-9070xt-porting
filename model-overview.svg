      <g transform="translate(535 370)"><rect width="140" height="42" rx="7" fill="url(#gold)" stroke="#f59e0b"/><text x="70" y="18" fill="#fef3c7" font-size="13" font-weight="700">256 档回程</text><text x="70" y="34" fill="#fbbf24" font-size="10">upsample + skip</text></g>

  </g>

  <g font-family="'DejaVu Sans Mono',monospace" font-size="13" fill="#5f6e82">
    <text x="40" y="352">src/  hip/  shaders/  scripts/  include/  tools/  Development/</text>
  </g>
  <text x="860" y="352" text-anchor="end" font-family="'WenQuanYi Micro Hei',sans-serif" font-size="13" fill="#5f6e82">给自己看的地图 · 2026-09-26</text>
